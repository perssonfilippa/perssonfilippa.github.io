<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#949139">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filippa Persson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<script src="theme.js"></script>
<style>
  :root { --nav-color: #ECEDE9; }

  /* Navbaren (layout, vikt, aktiv länk) styrs av style.css och är lika på alla sidor. */


  /* =====================================================================
     FÄRGER OCH TYPSNITT
     ===================================================================== */
  :root {
    --bg: #949139;
    --text: #ECEDE9;
    --heading-font: "Plus Jakarta Sans", sans-serif;
    --body-font: "Roboto", sans-serif;
    --content-left: 7.9vw;   /* vänster/höger marginal för innehållet */
    --hero-pad: max(var(--content-left), calc((100vw - 140vh) / 2));
  }

  /* ---------- Global typografi ---------- */
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--body-font);
    font-weight: 400;
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 18vh var(--hero-pad) 8vh;
    margin-bottom: 25vh;
  }

  .hero__photo-wrap {
    width: 25vw;            /* startvärde, justeras av scriptet */
    overflow: hidden;
  }

  .hero__photo {
    display: block;
    width: 100%;            /* justeras av scriptet */
    max-width: none;
    height: auto;
  }

  .hero__name {
    margin: 1.4vh 0 0;
    font-family: var(--heading-font);
    font-weight: 600;
    font-size: 10vw;            /* startvärde, justeras av scriptet */
    line-height: 0.85;
    text-transform: uppercase;
    white-space: nowrap;
    letter-spacing: 0;
    color: var(--text);
  }

  .hero__meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-top: 1.4vh;
    font-family: var(--body-font);
    font-weight: 400;
    font-size: clamp(0.7rem, 1.1vw, 1.05rem);
    line-height: 1.3;
  }

  .hero__meta p { margin: 0; }
  .hero__meta p:last-child { text-align: right; }

  /* ---------- Kontakt ---------- */
  .hero__contact {
    position: absolute;
    right: var(--hero-pad);
    bottom: -18vh;
    text-align: right;
    font-family: var(--body-font);
    font-weight: 400;
    font-size: clamp(0.7rem, 1.1vw, 1.05rem);
    line-height: 1.3;
  }

  .hero__contact p { margin: 0; }
  .hero__contact p + p { margin-top: 1.3em; }

  .hero__contact a {
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .hero__contact a:hover { opacity: 0.6; }

  /* Rubrikerna "Phone" och "Mail" visas bara på mobil */
  .contact__label { display: none; }


  /* ---------- Telefonnummer: klick kopierar numret ---------- */
  .phone { position: relative; display: inline-block; }

  .phone__btn {
    padding: 0;
    border: 0;
    background: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .phone__btn:hover { opacity: 0.6; }

  .phone__btn:focus { outline: none; }

  /* Ingen ruta runt numret. Tangentbordsanvändare ser fokus som understrykning. */
  .phone__btn:focus-visible {
    outline: none;
    text-decoration: underline;
    text-underline-offset: 0.25em;
  }

  /* "Copied!" som visas en kort stund efter kopiering:
     en rund, ifylld vit cirkel. Texten är grön (samma som bakgrunden) och
     blir svart i svartvitt-läget, eftersom --bg då är svart. */
  .phone__toast {
    position: absolute;
    right: calc(100% + 1.2em);   /* vid sidan av numret, åt vänster */
    bottom: calc(100% + 0.3em);  /* ovanför numrets rad, så den aldrig täcker mejladressen */
    z-index: 5;
    display: grid;
    place-items: center;
    box-sizing: border-box;
    width: 6.6em;
    aspect-ratio: 1;
    padding: 0.8em;
    border-radius: 50%;
    background: #fff;
    color: var(--bg);
    font-weight: 500;
    line-height: 1.15;
    text-align: center;
    text-wrap: balance;
    white-space: normal;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
    opacity: 0;
    transform: translate(6px, 0);
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
  }

  .phone__toast.is-visible {
    opacity: 1;
    transform: translate(0, 0);
  }

  /* ---------- Mobil ----------
     Bild + namn + beskrivning nära mitten av första skärmen,
     kontakten ligger under skärmkanten och syns när man scrollar. */
  @media (max-width: 600px) {
    .hero {
      justify-content: flex-start;
      min-height: 0;
      padding-top: 36vh;       /* var 32vh, högre tal = innehållet längre ner */
      padding-bottom: 12vh;
      margin-bottom: 0;
    }

    /* Bara beskrivningen visas; "Stockholm, Sweden..." döljs */
    .hero__meta { flex-direction: column; gap: 0; }
    .hero__meta p:first-child { font-size: clamp(0.62rem, 2.6vw, 1rem); }
    .hero__meta p:last-child { display: none; }

    /* Kontaktblocket: långt ner (utanför första skärmen), högerjusterat */
    .hero__contact {
      position: static;
      align-self: flex-end;
      margin-top: 45vh;        /* högre tal = längre ner, mer scroll */
      padding-top: 0;
      text-align: right;
      font-size: clamp(0.8rem, 3.3vw, 1.15rem);
    }

    .hero__contact br { display: none; }
    .hero__contact a,
    .phone__btn { font-weight: 500; }

    .contact__label {
      display: block;
      font-weight: 300;
    }
    .contact__label--mail { margin-top: 1.3em; }
  }

</style>
</head>
<body>

  <nav class="nav" aria-label="Huvudmeny">
    <a href="index.html" aria-current="page">Home</a>
    <div class="nav__right">
      <a href="work.html">Work</a>
      <a href="about.html">About</a>
    </div>
  </nav>

  <header class="hero" id="home">
    <div class="hero__photo-wrap">
      <img
        class="hero__photo"
        src="Springer.png"
        alt="Filippa Persson"
        decoding="async"
        fetchpriority="high"
      >
    </div>

    <h1 class="hero__name" id="heroName">Filippa Persson</h1>

    <div class="hero__meta">
      <p>Bringing ideas to life through visual design, interaction and<br>creative problem solving.</p>
      <p>Stockholm, Sweden<br>Interaction Design Student</p>
    </div>

    <address class="hero__contact" style="font-style: normal;">
      <p><a href="https://www.linkedin.com/in/persson-filippa" target="_blank" rel="noopener">LinkedIn</a></p>
      <p>
        <span class="contact__label">Phone</span>
        <span class="phone">
          <button class="phone__btn" id="phoneBtn" type="button" title="Klicka för att kopiera" aria-label="Kopiera telefonnumret 072-241 04 44">072-241 04 44</button>
          <span class="phone__toast" id="phoneToast" role="status" aria-live="polite">Phone number!</span>
        </span><br>
        <span class="contact__label contact__label--mail">Mail</span>
        <a href="mailto:filippa.per@gmail.com">filippa.per@gmail.com</a>
      </p>
    </address>
  </header>


  <script>
    const nameEl  = document.getElementById('heroName');
    const photoEl = document.querySelector('.hero__photo');
    const wrapEl  = document.querySelector('.hero__photo-wrap');
    const hero    = document.querySelector('.hero');
    const ctx     = document.createElement('canvas').getContext('2d');

    let frame = null;

    // Söker av en nedskalad kopia (max 300 px) i stället för hela bilden,
    // så att det går på millisekunder även med en stor PNG.
    function findFrame() {
      const nw = photoEl.naturalWidth, nh = photoEl.naturalHeight;
      if (!nw || !nh) return;
      try {
        const sc = Math.min(1, 300 / Math.max(nw, nh));
        const w = Math.max(1, Math.round(nw * sc)), h = Math.max(1, Math.round(nh * sc));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const g = c.getContext('2d', { willReadFrequently: true });
        g.drawImage(photoEl, 0, 0, w, h);
        const d = g.getImageData(0, 0, w, h).data;
        let x0 = w, y0 = h, x1 = -1, y1 = -1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] > 20) {
              if (x < x0) x0 = x;
              if (x > x1) x1 = x;
              if (y < y0) y0 = y;
              if (y > y1) y1 = y;
            }
          }
        }
        if (x1 >= x0 && y1 >= y0) {
          frame = { x: x0 / sc, y: y0 / sc, w: (x1 - x0 + 1) / sc, h: (y1 - y0 + 1) / sc };
        }
      } catch (e) {
        frame = null;
      }
    }

    function inkOf(text) {
      const m = ctx.measureText(text);
      return { left: m.actualBoundingBoxLeft, right: m.actualBoundingBoxRight,
               width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight };
    }

    function layoutPhoto(targetW) {
      const nw = photoEl.naturalWidth, nh = photoEl.naturalHeight;
      if (!nw || !nh) { wrapEl.style.width = targetW + 'px'; return; }
      const f = frame || { x: 0, y: 0, w: nw, h: nh };
      const k = targetW / f.w;
      photoEl.style.width      = (nw * k) + 'px';
      photoEl.style.marginLeft = (-f.x * k) + 'px';
      photoEl.style.marginTop  = (-f.y * k) + 'px';
      wrapEl.style.width  = targetW + 'px';
      wrapEl.style.height = (f.h * k) + 'px';
    }

    function fitName() {
      const cs = getComputedStyle(hero);
      const avail = hero.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);

      const size = 200;
      ctx.font = `600 ${size}px "Plus Jakarta Sans", sans-serif`;

      // Extra mellanrum mellan förnamn och efternamn, i em (0 = vanligt ordmellanrum).
      // Räknas in här så att hela namnet fortfarande fyller bredden exakt.
      const WORD_GAP = 0.1;

      const full  = inkOf(nameEl.textContent.trim().toUpperCase());
      const extra = WORD_GAP * size;
      const scale = avail / (full.width + extra);
      nameEl.style.fontSize = (size * scale) + 'px';
      nameEl.style.wordSpacing = (extra * scale) + 'px';
      nameEl.style.marginLeft = (full.left * scale) + 'px';

      layoutPhoto(inkOf('FILI').width * scale);
    }

    function onPhoto() { findFrame(); fitName(); }

    document.fonts.load('600 100px "Plus Jakarta Sans"').then(fitName);
    document.fonts.ready.then(fitName);
    if (photoEl.complete && photoEl.naturalWidth) onPhoto(); else photoEl.addEventListener('load', onPhoto, { once: true });
    window.addEventListener('resize', fitName);
    fitName();
  </script>

  <script>
    // Klick på telefonnumret kopierar det och visar en kort bekräftelse ("Copied!")
    (function () {
      const btn   = document.getElementById('phoneBtn');
      const toast = document.getElementById('phoneToast');
      if (!btn || !toast) return;
      const number = btn.textContent.trim();
      let timer;

      function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
      }

      function show(msg) {
        toast.textContent = msg;
        toast.classList.add('is-visible');
        clearTimeout(timer);
        timer = setTimeout(() => toast.classList.remove('is-visible'), 2000);
      }

      btn.addEventListener('click', async (e) => {
        if (e.detail) btn.blur();   // klick med mus: ingen kvarlämnad fokusruta
        let ok = false;
        try {
          await navigator.clipboard.writeText(number);
          ok = true;
        } catch (err) {
          ok = fallbackCopy(number);
        }
        show(ok ? 'Phone copied!' : 'Failed');
      });
    })();
  </script>

  <script src="cursor.js"></script>

</body>
</html>
